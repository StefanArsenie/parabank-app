name: Playwright Tests - Main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Which report to publish to GitHub Pages'
        required: true
        default: 'allure'
        type: choice
        options:
          - allure
          - html
      test_suite:
        description: 'Which test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test-matrix:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
          - 61616:61616
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Initialize ParaBank database
        run: curl -s http://localhost:8080/parabank/initializeDB.htm
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure HTML results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

  test-suite:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == 'regression') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
          - 61616:61616
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Initialize ParaBank database
        run: curl -s http://localhost:8080/parabank/initializeDB.htm
      - name: Run Playwright tests
        run: npm run test:${{ github.event.inputs.test_suite }}
      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event.inputs.test_suite }}
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure HTML results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ github.event.inputs.test_suite }}
          path: allure-results/
          retention-days: 30

  publish-report:
    needs: [test-matrix, test-suite]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: combined-allure-results
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Allure CLI
        run: npm install -g allure-commandline
      - name: Generate combined Allure report
        run: allure generate combined-allure-results --clean -o report
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
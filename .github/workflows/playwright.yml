name: Playwright Tests - Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Which report to publish to GitHub Pages'
        required: true
        default: 'allure'
        type: choice
        options:
          - allure
          - html
      test_suite:
        description: 'Which test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
          - 61616:61616
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Initialize ParaBank database
        run: curl -s http://localhost:8080/parabank/initializeDB.htm

      - name: Run Playwright tests
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'ci-default' }}"
          if [ "$SUITE" = "ci-default" ]; then
            npx playwright test --project=${{ matrix.browser }}
          else
            npm run test:$SUITE
          fi

      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          retention-days: 30

  publish-report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.report_type == 'html' && 'playwright-report-chromium' || 'allure-report-chromium' }}
          path: report

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Playwright Tests - Main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Which report to publish to GitHub Pages'
        required: true
        default: 'allure'
        type: choice
        options:
          - allure
          - html
      test_suite:
        description: 'Which test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - all

# Least-privilege by default; publish-report elevates its own scope.
permissions:
  contents: read

# Don't let two Pages deployments race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Fast static checks, run once, before any containers spin up.
  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  test-matrix:
    needs: quality
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      parabank:
        # TODO: replace :latest with a pinned digest — see change notes below.
        image: parasoft/parabank:latest
        ports:
          - 8080:8080
          - 61616:61616
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Initialize ParaBank database
        run: curl -s http://localhost:8080/parabank/initializeDB.htm
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure HTML results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

  test-suite:
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == 'regression') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      parabank:
        # TODO: replace :latest with a pinned digest — see change notes below.
        image: parasoft/parabank:latest
        ports:
          - 8080:8080
          - 61616:61616
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version